name: CI/CD Pipeline - Build and Deploy to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker Image via ACR
        run: |
          az acr build \
            --registry mymlregistry2026 \
            --image ml-prediction-service:${{ github.sha }} \
            --image ml-prediction-service:latest .

      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name ml-prediction-app \
            --resource-group my-ml-rg \
            --image mymlregistry2026.azurecr.io/ml-prediction-service:${{ github.sha }}