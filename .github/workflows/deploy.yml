name: CI/CD Pipeline - Build and Deploy to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name mymlregistry2026

      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t mymlregistry2026.azurecr.io/ml-prediction-service:${{ github.sha }} -t mymlregistry2026.azurecr.io/ml-prediction-service:latest .
          docker push mymlregistry2026.azurecr.io/ml-prediction-service:${{ github.sha }}
          docker push mymlregistry2026.azurecr.io/ml-prediction-service:latest

      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name ml-prediction-app \
            --resource-group my-ml-rg \
            --image mymlregistry2026.azurecr.io/ml-prediction-service:${{ github.sha }}